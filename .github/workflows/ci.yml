name: Always be deploying

on:
  pull_request:
    # labeled and unlabeled run the API check again when someone adds or removes breaking-allowed
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore:
      - 'README.md'
      - '.editorconfig'
  push:
    paths-ignore:
      - 'README.md'
      - '.editorconfig'
    branches:
      - main
    tags:
      - "*.*.*"

# nothing by default: each job asks for what it needs
permissions: {}

jobs:
  aot-validate:
    # adding a label only runs the API check again
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    permissions:
      contents: read # publishes and runs pull request code: no write token
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - runner: ubuntu-latest
          folder: linux-x64
          binary: transport-aot-example
        - runner: macos-latest
          folder: osx-arm64
          binary: transport-aot-example
        - runner: windows-latest
          folder: win-x64
          binary: transport-aot-example.exe
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: ./global.json

    - name: Publish AOT
      run: dotnet publish examples/transport-aot-example

    - name: Invoke AOT
      run: .artifacts/publish/transport-aot-example/release/${{ matrix.os.binary }}

  build:
    permissions:
      contents: read # builds and runs pull request code: no write token
      pull-requests: write # the API comment and labels on a pull request
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
        persist-credentials: false

    - run: |
        git fetch --prune --unshallow --tags
        echo exit code $?
        git tag --list

    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: ./global.json
        dotnet-version: |
          6.x
        
    - run: ./build.sh build -s true
      name: Build

    # What the pull request changes in the public API of the libraries, against their latest release on nuget.org, and
    # whether the committed api/*.api files match the build: one comment, the release label, and a failure on a
    # breaking change until someone adds breaking-allowed, or on files that are out of date.
    - uses: nullean/assembly-differ@ce2ac1dd29d2cf355adf1bb5991c9b977570499d # 1.5.1
      name: Report the public API changes
      if: github.event_name == 'pull_request'
      with:
        version: 1.5.1
        api-files: api
        projects: |
          src/Elastic.Transport/Elastic.Transport.csproj
          src/Elastic.Transport.VirtualizedCluster/Elastic.Transport.VirtualizedCluster.csproj

    # a push and a tag have no pull request to comment on, and still must not release out of date API files
    - run: ./build.sh verifyapi -s true
      name: Verify the committed public API files
      if: github.event_name != 'pull_request'

    - run: ./build.sh test -s true
      name: Test
      if: github.event.action != 'labeled' && github.event.action != 'unlabeled'

    - run: ./build.sh generatepackages -s true
      name: Generate local nuget packages
      if: github.event.action != 'labeled' && github.event.action != 'unlabeled'

    - run: ./build.sh validatepackages -s true
      name: "validate *.npkg files that were created"
      if: github.event.action != 'labeled' && github.event.action != 'unlabeled'

    # The packages the publish job pushes: built and validated here, from the commit that was tested, and kept for a day.
    - uses: actions/upload-artifact@v4
      name: Keep the packages for the publish job
      if: github.event_name == 'push'
      with:
        name: packages
        path: build/output/*.nupkg
        if-no-files-found: error
        retention-days: 1

  # The only job with a write token and the publishing secrets. It runs for a push to main and for a tag, never for a
  # pull request, and only publishes what the build job built and tested.
  publish:
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: write # the release for a tag
      issues: write # as before the permissions moved here
      packages: write # the canary packages
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
        persist-credentials: false

    - run: |
        git fetch --prune --unshallow --tags
        echo exit code $?
        git tag --list

    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: ./global.json
        dotnet-version: |
          6.x

    - uses: actions/download-artifact@v4
      name: Take the packages the build job kept
      with:
        name: packages
        path: build/output

    - name: publish canary packages github package repository
      if: github.event_name == 'push' && startswith(github.ref, 'refs/heads')
      shell: bash
      run:  |
          dotnet nuget add source --username USERNAME --password ${{secrets.GITHUB_TOKEN}} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/elastic/index.json"
          until dotnet nuget push 'build/output/*.nupkg' -k ${{secrets.GITHUB_TOKEN}} --skip-duplicate --no-symbols --source "github"; do echo "Retrying"; sleep 1; done;

    # Github packages requires authentication, this is likely going away in the future so for now we publish to feedz.io
    - run: dotnet nuget push 'build/output/*.nupkg' -k ${{secrets.FEEDZ_IO_API_KEY}} -s https://f.feedz.io/elastic/all/nuget/index.json --skip-duplicate --no-symbols
      name: publish canary packages to feedz.io
      if: github.event_name == 'push' && startswith(github.ref, 'refs/heads')

    - run: ./build.sh generatereleasenotes -s true
      name: Generate release notes for tag
      if: github.event_name == 'push' && startswith(github.ref, 'refs/tags')

    - run: ./build.sh createreleaseongithub -s true --token ${{secrets.GITHUB_TOKEN}}
      if: github.event_name == 'push' && startswith(github.ref, 'refs/tags')
      name: Create or update release for tag on github
          
    - run: dotnet nuget push 'build/output/*.nupkg' -k ${{secrets.NUGET_ORG_API_KEY}} -s https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
      name: release to nuget.org
      if: github.event_name == 'push' && startswith(github.ref, 'refs/tags')
